<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="Nett is a local-first relationship intelligence system for your personal network." />
    <title>Nett · Private relationship intelligence</title>
    <!-- Landing routes paint black before JS/CSS arrive. Workbench routes
         inherit --bg from the stylesheet so light mode is not trapped on
         the ceremonial landing black. -->
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
      }
      html.on-landing, body.on-landing, html.on-landing #root {
        background: #08090d !important;
      }
    </style>
    <link rel="preload" as="image" href="/brand/nett-crystal-n-wide.png" />
    <link rel="preload" as="image" href="/brand/nett-crystal-n.png" />
    <script>
      (function () {
        var p = location.pathname;
        if (p === "/" || p === "" || p === "/about") {
          document.documentElement.classList.add("on-landing");
          document.documentElement.style.background = "#08090d";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
